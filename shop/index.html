<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZZScent – Perfume Original & Decant</title>
<style>
:root{--bg:#f5f5f5;--card:#fff;--txt:#222;--mut:#757575;--pri:#b8892b;--pri2:#8f6a1c;--line:#eee;--wa:#25d366}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt);padding-bottom:70px}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
.top{position:sticky;top:0;z-index:20;background:linear-gradient(#111,#2a2112);padding:10px 12px;display:flex;gap:10px;align-items:center}
.logo{color:#e4bf6a;font-weight:800;letter-spacing:.12em}
.top input{flex:1;padding:9px 12px;border-radius:6px;border:0;min-width:0}
.cartbtn{background:none;color:#fff;font-size:1.4rem;position:relative}
.badge{position:absolute;top:-6px;right:-8px;background:#e53935;color:#fff;border-radius:10px;font-size:.7rem;padding:0 6px}
.banner{background:#2a2112;color:#e4bf6a;text-align:center;font-size:.8rem;padding:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px;background:#fff;position:sticky;top:52px;z-index:10;scrollbar-width:none}
.chip{flex:none;padding:7px 14px;border-radius:20px;background:#f0f0f0;font-size:.85rem}
.chip.on{background:var(--pri);color:#fff}
main{max-width:1000px;margin:auto;padding:10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr);gap:12px}}
.card{background:var(--card);border-radius:6px;overflow:hidden;cursor:pointer}
.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#eee}
.ci{padding:8px}
.ci h3{font-size:.85rem;font-weight:500;line-height:1.3;height:2.2em;overflow:hidden}
.pp{color:var(--pri2);font-weight:700;margin-top:6px}
.pp small{font-weight:400;color:var(--mut);font-size:.7rem}
.tag{display:inline-block;font-size:.65rem;border:1px solid var(--pri);color:var(--pri);padding:0 4px;border-radius:3px;margin-top:4px}
.empty{text-align:center;color:var(--mut);padding:40px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.open{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
@media(min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:16px}}
.sh-head{display:flex;gap:12px}
.sh-head img{width:90px;height:90px;border-radius:8px;object-fit:cover}
.x{float:right;background:none;font-size:1.4rem;color:var(--mut)}
h4{margin:16px 0 8px;font-size:.9rem}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:8px 12px;border:1px solid #ddd;border-radius:6px;background:#fff;font-size:.85rem}
.opt.on{border-color:var(--pri);color:var(--pri2);background:#fbf4e2;font-weight:600}
.qty{display:flex;align-items:center;gap:12px}
.qty button{width:34px;height:34px;border-radius:6px;background:#f0f0f0;font-size:1.1rem}
.row{display:flex;gap:8px;margin-top:18px}
.btn{flex:1;padding:13px;border-radius:8px;font-weight:700}
.b1{background:#fbf4e2;color:var(--pri2);border:1px solid var(--pri)}
.b2{background:var(--pri);color:#fff}
.b3{background:var(--wa);color:#fff}
.item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.item img{width:56px;height:56px;border-radius:6px;object-fit:cover}
.item .m{flex:1;font-size:.85rem}.item .m small{color:var(--mut)}
.line{display:flex;justify-content:space-between;padding:4px 0;font-size:.9rem}
.tot{font-weight:800;font-size:1.05rem;border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
.f{display:flex;flex-direction:column;gap:8px}
.f input,.f textarea,.f select{padding:11px;border:1px solid #ddd;border-radius:8px;width:100%}
.pay{display:flex;flex-direction:column;gap:8px}
.pay label{display:flex;gap:10px;padding:11px;border:1px solid #ddd;border-radius:8px;align-items:center;font-size:.9rem}
.pay input:checked+span{font-weight:700;color:var(--pri2)}
.payinfo{background:#fbf4e2;border-radius:8px;padding:10px;font-size:.85rem;margin-top:8px}
.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:none;z-index:30;padding:10px 12px;justify-content:space-between;align-items:center}
.bottom .btn{flex:none;padding:11px 22px}
.free{font-size:.75rem;color:#2e7d32;margin-top:4px}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:20px;z-index:60;font-size:.85rem;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="top"><span class="logo">ZZSCENT</span><input id="q" placeholder="Cari perfume..." oninput="render()"><button class="cartbtn" onclick="openCart()">🛒<span class="badge" id="cnt">0</span></button></div>
<div class="banner">✅ 100% Original · 🚚 Penghantaran seluruh Malaysia · Percuma pos RM150 ke atas</div>
<div class="chips" id="chips"></div>
<main><div class="grid" id="grid"></div><div class="empty" id="empty" hidden>Tiada produk dijumpai</div></main>

<div class="bottom" id="bottom"><div><b id="bsum"></b><div class="free" id="bfree"></div></div><button class="btn b2" onclick="openCart()">Troli</button></div>
<div class="sheet-bg" id="bg" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============ EDIT SINI ============ */
const SHOP = {
  wa: "60123456789",              // nombor WhatsApp (tanpa +)
  freeShip: 150,                  // percuma pos jika jumlah >= ini
  shipWM: 8, shipEM: 15,          // kos pos Semenanjung / Sabah Sarawak
  bank: "Maybank 1234567890 (ZZScent Enterprise)",
  duitnow: "0123456789",          // no DuitNow / QR
};
const CATS = ["Semua","Decant","Full Botol","Lelaki","Perempuan","Unisex"];
const PRODUCTS = [
 {id:1,name:"Bleu de Chanel EDP",img:"bleu.png",cats:["Lelaki"],sold:120,
  variants:{"Decant 5ml":25,"Decant 10ml":45,"Full Botol 100ml":520}},
 {id:2,name:"Demon Dancer",img:"dd.png",cats:["Unisex"],sold:64,
  variants:{"Decant 5ml":20,"Decant 10ml":35,"Full Botol 100ml":380}},
];
/* =================================== */
const $=id=>document.getElementById(id);
const rm=n=>"RM"+n.toFixed(n%1?2:0);
let cat="Semua", cart=JSON.parse(localStorage.getItem("zz_cart")||"[]"), cur=null;
const save=()=>{localStorage.setItem("zz_cart",JSON.stringify(cart));upd()};
function isFull(v){return v.startsWith("Full")}

$("chips").innerHTML=CATS.map(c=>`<button class="chip ${c==cat?"on":""}" onclick="setCat('${c}')">${c}</button>`).join("");
function setCat(c){cat=c;[...$("chips").children].forEach(b=>b.classList.toggle("on",b.textContent==c));render()}
function render(){
 const q=$("q").value.toLowerCase();
 const list=PRODUCTS.filter(p=>p.name.toLowerCase().includes(q)&&(cat=="Semua"||p.cats.includes(cat)||
   (cat=="Decant"&&Object.keys(p.variants).some(v=>!isFull(v)))||(cat=="Full Botol"&&Object.keys(p.variants).some(isFull))));
 $("grid").innerHTML=list.map(p=>`<div class="card" onclick="openProd(${p.id})"><img src="${p.img}" alt="">
  <div class="ci"><h3>${p.name}</h3><span class="tag">Original</span>
  <div class="pp"><small>dari</small> ${rm(Math.min(...Object.values(p.variants)))} <small style="float:right">${p.sold} terjual</small></div></div></div>`).join("");
 $("empty").hidden=list.length>0;
}
function sheet(h){$("sheet").innerHTML=h;$("bg").classList.add("open")}
function closeSheet(){$("bg").classList.remove("open")}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1500)}

function openProd(id){
 const p=PRODUCTS.find(x=>x.id==id), vs=Object.keys(p.variants);
 cur={p,v:vs[0],q:1};drawProd();
}
function drawProd(){
 const {p,v,q}=cur;
 sheet(`<button class="x" onclick="closeSheet()">✕</button>
 <div class="sh-head"><img src="${p.img}"><div><b>${p.name}</b><div class="pp" style="font-size:1.2rem">${rm(p.variants[v])}</div><small style="color:var(--mut)">${p.sold} terjual</small></div></div>
 <h4>Pilih saiz</h4><div class="opts">${Object.keys(p.variants).map(k=>`<button class="opt ${k==v?"on":""}" onclick="cur.v='${k}';drawProd()">${k} · ${rm(p.variants[k])}</button>`).join("")}</div>
 <h4>Kuantiti</h4><div class="qty"><button onclick="cur.q=Math.max(1,cur.q-1);drawProd()">−</button><b>${q}</b><button onclick="cur.q++;drawProd()">+</button></div>
 <div class="row"><button class="btn b1" onclick="addCur();toast('Masuk troli ✓');closeSheet()">Masuk Troli</button><button class="btn b2" onclick="addCur();openCart()">Beli Sekarang</button></div>`);
}
function addCur(){
 const {p,v,q}=cur, k=p.id+"|"+v, ex=cart.find(c=>c.k==k);
 if(ex)ex.q+=q;else cart.push({k,id:p.id,v,q});save();
}
const price=c=>PRODUCTS.find(p=>p.id==c.id).variants[c.v];
const sub=()=>cart.reduce((a,c)=>a+price(c)*c.q,0);
function upd(){
 const n=cart.reduce((a,c)=>a+c.q,0), s=sub();
 $("cnt").textContent=n;$("bottom").style.display=n?"flex":"none";
 $("bsum").textContent=n+" item · "+rm(s);
 $("bfree").textContent=s>=SHOP.freeShip?"🎉 Percuma pos!":"Tambah "+rm(SHOP.freeShip-s)+" lagi untuk percuma pos";
}
function openCart(){
 if(!cart.length){sheet(`<button class="x" onclick="closeSheet()">✕</button><div class="empty">Troli kosong</div>`);return}
 const s=sub();
 sheet(`<button class="x" onclick="closeSheet()">✕</button><b style="font-size:1.1rem">Troli Saya</b>
 ${cart.map((c,i)=>{const p=PRODUCTS.find(x=>x.id==c.id);return `<div class="item"><img src="${p.img}"><div class="m">${p.name}<br><small>${c.v}</small><br><b style="color:var(--pri2)">${rm(price(c))}</b></div>
 <div class="qty"><button onclick="chg(${i},-1)">−</button><b>${c.q}</b><button onclick="chg(${i},1)">+</button></div></div>`}).join("")}
 <div class="line tot"><span>Jumlah barang</span><span>${rm(s)}</span></div>
 <div class="row"><button class="btn b2" onclick="openCheckout()">Checkout</button></div>`);
}
function chg(i,d){cart[i].q+=d;if(cart[i].q<1)cart.splice(i,1);save();openCart()}
function ship(){const r=$("reg")?$("reg").value:"WM";return sub()>=SHOP.freeShip?0:(r=="WM"?SHOP.shipWM:SHOP.shipEM)}
function openCheckout(){
 sheet(`<button class="x" onclick="closeSheet()">✕</button><b style="font-size:1.1rem">Checkout</b>
 <h4>Maklumat penghantaran</h4><div class="f">
 <input id="nm" placeholder="Nama penuh" autocomplete="name">
 <input id="ph" type="tel" placeholder="No. telefon" autocomplete="tel">
 <textarea id="ad" rows="3" placeholder="Alamat penuh + poskod" autocomplete="street-address"></textarea>
 <select id="reg" onchange="sum()"><option value="WM">Semenanjung Malaysia</option><option value="EM">Sabah / Sarawak</option></select></div>
 <h4>Cara bayaran</h4><div class="pay">
 <label><input type="radio" name="pm" value="DuitNow / Bank Transfer" checked onchange="payinfo()"><span>DuitNow / Bank Transfer</span></label>
 <label><input type="radio" name="pm" value="COD" onchange="payinfo()"><span>Cash on Delivery (COD)</span></label></div>
 <div class="payinfo" id="pi"></div>
 <h4>Ringkasan</h4><div id="sm"></div>
 <div class="row"><button class="btn b3" onclick="place()">Hantar Order via WhatsApp</button></div>`);
 payinfo();sum();
}
function payinfo(){
 const v=document.querySelector("[name=pm]:checked").value;
 $("pi").innerHTML=v=="COD"?"Bayar bila barang sampai. COD tersedia untuk kawasan tertentu sahaja; kami sahkan melalui WhatsApp."
  :`Selepas hantar order, transfer ke:<br><b>${SHOP.bank}</b><br>DuitNow: <b>${SHOP.duitnow}</b><br>Hantar bukti bayaran di WhatsApp.`;
}
function sum(){const s=sub(),sh=ship();$("sm").innerHTML=`<div class="line"><span>Subjumlah</span><span>${rm(s)}</span></div><div class="line"><span>Pos</span><span>${sh?rm(sh):"PERCUMA"}</span></div><div class="line tot"><span>Jumlah bayaran</span><span>${rm(s+sh)}</span></div>`}
function place(){
 const nm=$("nm").value.trim(),ph=$("ph").value.trim(),ad=$("ad").value.trim();
 if(!nm||!ph||!ad){toast("Sila isi nama, telefon & alamat");return}
 const pm=document.querySelector("[name=pm]:checked").value,sh=ship(),tot=sub()+sh;
 const msg=`*ORDER BARU – ZZScent*\n\n`+cart.map(c=>`• ${PRODUCTS.find(p=>p.id==c.id).name} (${c.v}) x${c.q} = ${rm(price(c)*c.q)}`).join("\n")
 +`\n\nPos: ${sh?rm(sh):"Percuma"}\n*Jumlah: ${rm(tot)}*\nBayaran: ${pm}\n\nNama: ${nm}\nTel: ${ph}\nAlamat: ${ad}`;
 window.open("https://wa.me/"+SHOP.wa+"?text="+encodeURIComponent(msg),"_blank");
 cart=[];save();closeSheet();toast("Order dihantar ✓");
}
render();upd();
</script>
</body>
</html>
